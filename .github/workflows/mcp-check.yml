name: MCP source certification

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/bke-mcp-build
      - name: MCP HTTP handshake
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/bke-mcp-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for try in $(seq 1 30); do
            if curl --silent --max-time 1 http://127.0.0.1:8787/ > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! node scripts/mcp-smoke.mjs; then
            cat /tmp/bke-mcp-dev.log
            exit 1
          fi

      # TEMPORARY RELEASE TRANSPORT ONLY — close this PR WITHOUT merging.
      - name: Checkout exact owner-authorized main release source (independent checkout)
        uses: actions/checkout@v4
        with:
          ref: d65d144377fd22be47a7246835a4d5b9de4b4e7d
          path: release-source
          persist-credentials: false
      - name: Verify immutable source, all seven skill blobs, and existing public Worker configuration
        run: |
          set -euo pipefail
          test "$(git -C release-source rev-parse HEAD)" = "d65d144377fd22be47a7246835a4d5b9de4b4e7d"
          test "$(git -C release-source rev-parse HEAD^{tree})" = "9e6a3b97a5f2873e71be19c1df825cae8952d090"
          test "$(git -C release-source status --porcelain)" = ""
          test "$(git -C release-source rev-parse HEAD:skills/bke-causal-investigation/SKILL.md)" = "aecbdc9d0030265841a1c9d49c895d686f777c6b"
          test "$(git -C release-source rev-parse HEAD:skills/bke-decision-discipline/SKILL.md)" = "45e7a79f4b8569b1c2f6f82cdb814086821f017c"
          test "$(git -C release-source rev-parse HEAD:skills/bke-forge-bounded-execution/SKILL.md)" = "813199116212437fcc0820b98211a885eb33a62f"
          test "$(git -C release-source rev-parse HEAD:skills/bke-lean-engineering/SKILL.md)" = "badf3f24663805354fc8ac9c4e7ab5f7d6de7d27"
          test "$(git -C release-source rev-parse HEAD:skills/bke-owner-handoff/SKILL.md)" = "f48f576ba0cf2e898fa3aa691da799118c69de0f"
          test "$(git -C release-source rev-parse HEAD:skills/bke-security-review/SKILL.md)" = "6a0b043eb370d3ef87f81373be7801cd50a9e69d"
          test "$(git -C release-source rev-parse HEAD:skills/bke-test-certification/SKILL.md)" = "ce5dafb51ea632e967b7d3f5091cd642d36757ed"
          grep -Eq '"workers_dev"[[:space:]]*:[[:space:]]*true' release-source/wrangler.jsonc
          grep -q '"name": "bke-skills-mcp"' release-source/wrangler.jsonc
          grep -q '"compatibility_date": "2026-10-13"' release-source/wrangler.jsonc
      - name: Certify and export verified exact-source Worker module (NO deployment)
        working-directory: release-source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build:catalog
          npx wrangler deploy --dry-run --outdir /tmp/bke-skills-primary-first-release
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import zlib from 'node:zlib';
          const source="d65d144377fd22be47a7246835a4d5b9de4b4e7d";
          const tree="9e6a3b97a5f2873e71be19c1df825cae8952d090";
          const expected=Object.fromEntries([["bke-causal-investigation","aecbdc9d0030265841a1c9d49c895d686f777c6b"],["bke-decision-discipline","45e7a79f4b8569b1c2f6f82cdb814086821f017c"],["bke-forge-bounded-execution","813199116212437fcc0820b98211a885eb33a62f"],["bke-lean-engineering","badf3f24663805354fc8ac9c4e7ab5f7d6de7d27"],["bke-owner-handoff","f48f576ba0cf2e898fa3aa691da799118c69de0f"],["bke-security-review","6a0b043eb370d3ef87f81373be7801cd50a9e69d"],["bke-test-certification","ce5dafb51ea632e967b7d3f5091cd642d36757ed"]]);
          const {snapshot}=await import('./src/catalog.snapshot.mjs');
          if (snapshot.source_commit!==source || snapshot.tree_sha!==tree ||
              snapshot.skills.length!==Object.keys(expected).length) throw Error('Wrong immutable release snapshot');
          for (const item of snapshot.skills) {
            if (expected[item.name]!==item.blob_sha ||
                item.path!=='skills/'+item.name+'/SKILL.md' ||
                typeof item.description!=='string' || !item.description.trim() ||
                typeof item.content!=='string') throw Error('Unexpected skill metadata or bytes: '+item.name);
          }
          const dir='/tmp/bke-skills-primary-first-release';
          const modules=fs.readdirSync(dir).filter(f=>f.endsWith('.js'));
          if (modules.length!==1) throw Error('Expected exactly one JavaScript module');
          const data=fs.readFileSync(path.join(dir,modules[0]));
          for (const needle of [source, tree, ...Object.values(expected), 'available_skills', 'readOnlyHint']) {
            if (!data.includes(Buffer.from(needle))) throw Error('Compiled module missing: '+needle);
          }
          const sha256=crypto.createHash('sha256').update(data).digest('hex');
          const encoded=zlib.gzipSync(data,{level:9,mtime:0}).toString('base64');
          console.log('BKE_RELEASE_COMMIT:'+source);
          console.log('BKE_RELEASE_TREE:'+tree);
          console.log('BKE_RELEASE_NAME:'+modules[0]);
          console.log('BKE_RELEASE_SHA256:'+sha256);
          console.log('BKE_RELEASE_BYTES:'+data.length);
          for (let offset=0;offset<encoded.length;offset+=3000)
            console.log('BKE_RELEASE_PART:'+offset+':'+encoded.slice(offset,offset+3000));
          console.log('BKE_RELEASE_COMPLETE:'+encoded.length);
          NODE

      - name: LIVE MCP JSON-RPC read-only metadata and exact-source verification
        working-directory: release-source
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const endpoint='https://bke-skills-mcp.jan2xpagauisan.workers.dev/mcp';
          let id=0;
          async function rpc(method,params={}) {
            const requestId=++id;
            const response=await fetch(endpoint,{
              method:'POST',headers:{
                'content-type':'application/json',
                'accept':'application/json, text/event-stream',
                'MCP-Protocol-Version':'2025-11-25'
              },
              body:JSON.stringify({jsonrpc:'2.0',id:requestId,method,params}),
              signal:AbortSignal.timeout(15000)
            });
            const raw=await response.text();
            assert.equal(response.status,200,method+': HTTP '+response.status+' '+raw.slice(0,400));
            const parsed=response.headers.get('content-type')?.includes('text/event-stream')
              ?raw.split(/\r?\n/).filter(x=>x.startsWith('data: ')).map(x=>JSON.parse(x.slice(6))).find(x=>x.id===requestId)
              :JSON.parse(raw);
            assert.ok(parsed && !parsed.error,method+': invalid JSON-RPC response '+JSON.stringify(parsed?.error));
            return parsed.result;
          }
          const init=await rpc('initialize',{protocolVersion:'2025-11-25',capabilities:{},clientInfo:{name:'bke-live-release-ci',version:'1.0.0'}});
          assert.ok(init.protocolVersion);
          const listing=await rpc('tools/list');
          assert.deepEqual(listing.tools.map(x=>x.name).sort(),['get_skill','list_skills']);
          const annotations={readOnlyHint:true,destructiveHint:false,idempotentHint:true,openWorldHint:false};
          for(const tool of listing.tools)assert.deepEqual(tool.annotations,annotations,tool.name+' incorrect read-only MCP annotations');
          const initial=await rpc('tools/call',{name:'get_skill',arguments:{name:'bke-lean-engineering'}});
          assert.ok(!initial.isError);
          const primary=JSON.parse(initial.content[0].text);
          const expectedTree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          assert.equal(primary.tree_sha,expectedTree);
          assert.equal(primary.skill_text,execFileSync('git',['show','HEAD:skills/bke-lean-engineering/SKILL.md'],{encoding:'utf8'}));
          assert.equal(primary.available_skills?.length,7);
          const legacy=await rpc('tools/call',{name:'list_skills',arguments:{}});
          assert.ok(!legacy.isError);
          const catalog=JSON.parse(legacy.content[0].text);
          assert.equal(catalog.tree_sha,expectedTree);
          assert.deepEqual(primary.available_skills,catalog.skills.map(({name,description,blob_sha})=>({name,description,blob_sha})));
          for (const skill of primary.available_skills) {
            const expectedBlob=execFileSync('git',['rev-parse','HEAD:skills/'+skill.name+'/SKILL.md'],{encoding:'utf8'}).trim();
            assert.equal(skill.blob_sha,expectedBlob);
            const read=await rpc('tools/call',{name:'get_skill',arguments:{name:skill.name,blob_sha:skill.blob_sha}});
            assert.ok(!read.isError,skill.name);
            const result=JSON.parse(read.content[0].text);
            assert.equal(result.blob_sha,expectedBlob);
            assert.equal(result.tree_sha,expectedTree);
            assert.equal(result.skill_text,execFileSync('git',['show','HEAD:skills/'+skill.name+'/SKILL.md'],{encoding:'utf8'}));
          }
          for (const args of [
            {name:'nonexistent-skill'},
            {name:'bke-lean-engineering',blob_sha:'93af0e8cb0f21bb460fcd18c9ccf85c30630aecd'},
            {name:'bke-lean-engineering',blob_sha:'f'.repeat(40)}
          ]) {
            const result=await rpc('tools/call',{name:'get_skill',arguments:args});
            assert.equal(result.isError,true,JSON.stringify(args));
          }
          console.log('LIVE MCP initialize/tools/list annotations, primary-first index, seven exact pinned bytes, legacy list and negative cases: PASS');
          NODE
