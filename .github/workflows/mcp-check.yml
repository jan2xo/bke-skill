name: MCP source certification

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Export one-time npm lock for repository certification
        run: |
          node -e "const fs=require('node:fs'); const b=fs.readFileSync('package-lock.json').toString('base64'); for(let i=0;i<b.length;i+=3000) console.log('LOCKPART:'+i+':'+b.slice(i,i+3000));"
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/bke-mcp-build
      - name: MCP HTTP handshake
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/bke-mcp-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for try in $(seq 1 30); do
            if curl --silent --max-time 1 http://127.0.0.1:8787/ > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! node scripts/mcp-smoke.mjs; then
            cat /tmp/bke-mcp-dev.log
            exit 1
          fi
