name: MCP source certification

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/bke-mcp-build
      - name: MCP HTTP handshake
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/bke-mcp-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for try in $(seq 1 30); do
            if curl --silent --max-time 1 http://127.0.0.1:8787/ > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! node scripts/mcp-smoke.mjs; then
            cat /tmp/bke-mcp-dev.log
            exit 1
          fi
      - name: Checkout exact authorized release source (separate from PR changes)
        uses: actions/checkout@v4
        with:
          ref: c0d89fbd4bd0d8b5c9d49daf8b4101b08f13a9cd
          path: authorized-release
          persist-credentials: false
      - name: Verify second checkout is the exact authorized source
        run: |
          test "$(git -C authorized-release rev-parse HEAD)" = "c0d89fbd4bd0d8b5c9d49daf8b4101b08f13a9cd"
          test "$(git -C authorized-release status --porcelain)" = ""
      - name: Certify and export exact-source Cloudflare Worker bundle
        working-directory: authorized-release
        run: |
          npm ci --no-audit --no-fund
          npm run build:catalog
          npx wrangler deploy --dry-run --outdir /tmp/bke-authorized-release
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import zlib from 'node:zlib';
          const dir='/tmp/bke-authorized-release';
          const files=fs.readdirSync(dir).filter(f=>f.endsWith('.js'));
          if(files.length!==1)throw Error('Expected exactly one release JavaScript bundle');
          const raw=fs.readFileSync(path.join(dir,files[0]));
          if(!raw.includes(Buffer.from('c0d89fbd4bd0d8b5c9d49daf8b4101b08f13a9cd')))
            throw Error('Compiled Worker missing exact authorized source revision');
          const digest=crypto.createHash('sha256').update(raw).digest('hex');
          const gz=zlib.gzipSync(raw,{level:9,mtime:0}).toString('base64');
          console.log('BKE_RELEASE_SOURCE:c0d89fbd4bd0d8b5c9d49daf8b4101b08f13a9cd');
          console.log('BKE_RELEASE_NAME:'+files[0]);
          console.log('BKE_RELEASE_SHA256:'+digest);
          console.log('BKE_RELEASE_SIZE:'+raw.length);
          for(let i=0;i<gz.length;i+=3000)
            console.log('BKE_RELEASE_PART:'+i+':'+gz.slice(i,i+3000));
          console.log('BKE_RELEASE_COMPLETE:'+gz.length);
          NODE
      - name: Verify PUBLIC deployed MCP initialize / tools / skill listing / valid retrieval
        run: |
          sed -i 's|http://127.0.0.1:8787/mcp|https://bke-skills-mcp.jan2xpagauisan.workers.dev/mcp|' scripts/mcp-smoke.mjs
          node scripts/mcp-smoke.mjs
